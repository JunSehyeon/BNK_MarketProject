<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <style>
        html,
        body {
            margin: 0
        }

        a {
            text-decoration: none;
            color: #000
        }

        body {
            font-family: system-ui, sans-serif;
            font-size: clamp(14px, 1.2vw, 16px);
            color: #000
        }

        /* 1) 전체 레이아웃 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100dvh;
        }

        /* 2) 왼쪽(로그인) 영역 */
        .login-side {
            display: grid;
            place-items: center;
            padding: 24px;
            background: #fff;
        }

        .login-panel {
            width: min(620px, 90%)
        }

        /* 폼 중첩 제거: div 컨테이너 */

        .header-logo {
            margin-bottom: 20px;
            width: 300px
        }

        .header-logo-img {
            width: min(190px, 100%)
        }

        .login-text {
            font-size: 22px;
            font-weight: 600;
            margin: 8px 0 4px
        }

        .form-field {
            margin-top: 16px
        }

        .form-field-email input,
        .form-field-pw input {
            box-sizing: border-box;
            width: 100%;
            padding-top: 26px;
            padding-bottom: 7px;
            border: none;
            border-bottom: 1px solid #000;
            transition: border-color .2s;
        }

        .form-field-email input:focus,
        .form-field-pw input:focus {
            outline: none
        }

        .error-msg {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            color: #e53935;
            line-height: 1.3
        }

        .error-msg::before {
            content: "ⓘ";
            margin-right: 6px;
            font-weight: 600
        }

        .form-field-email.is-invalid input,
        .form-field-pw.is-invalid input {
            border-bottom-color: #e53935
        }

        .form-field-email.is-invalid .error-msg,
        .form-field-pw.is-invalid .error-msg {
            display: block
        }

        .login-assist {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 13px;
        }

        .find-pw a {
            margin-right: 4px
        }

        .find-pw a:last-child {
            margin-right: 0
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
            padding: 0;
            cursor: pointer;
            accent-color: #000;
            vertical-align: middle;
        }

        .btn-log {
            display: block;
            width: 100%;
            margin-top: 40px;
            padding: 8px;
            background: #000;
            color: #fff;
            border: 0;
            cursor: pointer;
        }

        /* 3) 소셜 로그인 (고정 크기) */
        .form-field-social {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            /* 아이콘 간 간격 */
            margin-top: 28px;
            /* LOGIN 버튼과 간격 */
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            /* ← 고정 크기 */
            border-radius: 0%;
            background: #fff;
            border: 1px solid #eaeaea;
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .social-btn:hover,
        .social-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
            outline: none;
        }

        .social-btn img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            /* 로고 비율 */
        }

        .btn-reg {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 7px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
        }

        .help-link {
            font-size: 13px;
            margin-top: 64px
        }

        /* 4) 오른쪽(이미지) 영역 */
        .image-side {
            background: url("https://images.unsplash.com/photo-1752729200157-18e70946c35c?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D") center/cover no-repeat;
        }

        .site-max {
            max-width: none;
            width: 100%;
            margin-inline: auto
        }

        /* 5) 반응형(원하면 유지/삭제 가능) */
        @media (max-width:960px) {
            .main-layout {
                grid-template-columns: 1fr
            }

            .image-side {
                display: none
            }
        }

        /* 접근성: 화면 숨김 텍스트 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 1, 1);
            white-space: nowrap;
            border: 0;
        }
    </style>

</head>

<body>
    <div class="main-layout site-max">
        <!-- 좌측 로그인 -->
        <section class="login-side">
            <!-- 바깥 컨테이너는 div (폼 중첩 방지) -->
            <div class="login-panel">
                <div class="header-logo">
                    <img class="header-logo-img" src="../images/logo.png" alt="logo">
                </div>
                <div class="login-text">로그인</div>

                <!-- 실제 제출되는 폼: 단 하나만 -->
                <form id="loginForm" class="login-form" method="post" novalidate>
                    <div class="form-field form-field-email">
                        <input id="email" name="email" type="email" placeholder="이메일" required />
                        <p class="error-msg"></p>
                    </div>

                    <div class="form-field form-field-pw">
                        <input id="password" name="password" type="password" placeholder="비밀번호" minlength="4"
                            required />
                        <p class="error-msg"></p>
                    </div>

                    <div class="login-assist">
                        <div class="find-pw">
                            <a href="#">아이디 찾기 |</a>
                            <a href="#">비밀번호 찾기</a>
                        </div>
                        <div class="auto-login">
                            <input type="checkbox" id="remember">
                            <label for="remember">자동 로그인</label>
                        </div>
                    </div>

                    <button class="btn-log" type="submit">LOGIN</button>

                    <!-- 소셜 로그인 (가운데 정렬/아이콘 동일 크기) -->
                    <div class="form-field-social" role="group" aria-label="간편 로그인">
                        <a href="#" class="social-btn" aria-label="카카오 로그인">
                            <img src="../images/icon_sns_kakao.png" alt="">
                            <span class="sr-only">카카오로 로그인</span>
                        </a>
                        <a href="#" class="social-btn" aria-label="네이버 로그인">
                            <img src="../images/icon_sns_naver.png" alt="">
                            <span class="sr-only">네이버로 로그인</span>
                        </a>
                        <a href="#" class="social-btn" aria-label="구글 로그인">
                            <img src="../images/icon_sns_google.png" alt="">
                            <span class="sr-only">구글로 로그인</span>
                        </a>
                    </div>

                    <button class="btn-reg" type="button">REGISTER</button>

                    <div class="help-link"><a href="#">도움말</a></div>
                </form>
            </div>
        </section>

        <!-- 우측 이미지 -->
        <aside class="image-side"></aside>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const groups = [
            document.querySelector('.form-field-email'),
            document.querySelector('.form-field-pw')
        ];

        function validateGroup(group) {
            const input = group.querySelector('input');
            const msg = group.querySelector('.error-msg');
            const v = input.validity;
            let text = "";

            if (v.valid) {
                group.classList.remove('is-invalid');
                group.classList.add('is-valid');
                msg.textContent = "";
                return;
            }
            group.classList.add('is-invalid');
            group.classList.remove('is-valid');

            if (input.type === "email") {
                if (v.valueMissing) text = "이메일 필드는 필수 항목입니다.";
                else if (v.typeMismatch) text = "유효하지 않은 이메일. 예: user@example.com";
                else text = "이메일 형식이 올바르지 않습니다.";
            } else if (input.type === "password") {
                if (v.valueMissing) text = "비밀번호 필드는 필수 항목입니다.";
                else if (v.tooShort) text = "비밀번호는 최소 4자 이상 입력해야 합니다.";
                else text = "";
            }
            msg.textContent = text;
        }

        groups.forEach(group => {
            const input = group.querySelector('input');
            input.addEventListener('blur', () => validateGroup(group));
            input.addEventListener('input', () => {
                if (group.classList.contains('is-invalid') || group.classList.contains('is-valid')) {
                    validateGroup(group);
                }
            });
        });

        form.addEventListener('submit', (e) => {
            let allValid = true;
            groups.forEach(g => {
                validateGroup(g);
                const input = g.querySelector('input');
                if (!input.checkValidity()) allValid = false;
            });
            if (!allValid) e.preventDefault();
        });
    </script>
</body>

</html>
