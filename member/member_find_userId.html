<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>아이디 찾기</title>
    <style>
        :root {
            --black: #111;
            --gray: #777;
            --light: #f4f5f7;
            --primary: #111;
            --accent: #3F97F6
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Pretendard, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif;
            color: var(--black);
            background: #fff
        }

        .wrap {
            max-width: 760px;
            margin: 48px auto;
            padding: 0 20px
        }

        h1 {
            font-size: 40px;
            letter-spacing: -.02em;
            margin: 0 0 24px;
            text-align: center
        }

        .desc {
            color: #555;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 28px
        }

        .card {
            background: #fff;
            border: 1px solid #e6e6e6;
            padding: 28px 24px
        }

        .row {
            margin-bottom: 18px
        }

        label {
            display: block;
            font-weight: 600;
            margin: 0 0 8px
        }

        .field {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #ddd;
            outline: none
        }

        .field:focus {
            border-color: #222;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .06)
        }

        .helper {
            font-size: 13px;
            color: #888;
            margin-top: 6px
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px
        }

        .btn {
            flex: 1 1 0;
            height: 50px;
            border: 1px solid #111;
            background: #111;
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        .btn.secondary {
            background: #fff;
            color: #111
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .inline {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .sub-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px
        }

        .hidden {
            display: none
        }

        .select {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            padding: 0 12px
        }

        .bar {
            height: 1px;
            background: #eee;
            margin: 20px 0
        }

        .row-email {
            margin: 10px 0 18px 0;
        }

        /* 접근성용 시각적 숨김 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 1, 1);
            white-space: nowrap;
            border: 0;
        }

        /* 인증번호 입력 줄: 입력칸은 늘리고, 버튼은 고정 가로 직사각 */
        #emailVerifyGroup .inline {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }

        #emailVerifyGroup .inline .field {
            flex: 1 1 auto;
            /* 입력칸이 가로 공간 대부분 차지 */
            width: auto;
            /* width:100% 상쇄 */
        }

        #emailVerifyGroup .inline .btn {
            flex: 0 0 120px;
            /* 가로 고정 */
            width: 120px;
            height: 48px;
            /* 입력칸 높이와 맞춤 */
            border-radius: 0;
            /* 직사각형 */
            white-space: nowrap;
            /* '확인' 줄바꿈 방지 */
        }
    </style>
</head>

<script>
    fetch("../main/header.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("header").innerHTML = data;
            const scripts = document.getElementById("header").querySelectorAll("script");
            scripts.forEach(oldScript => {
                const s = document.createElement("script");
                if (oldScript.src) { s.src = oldScript.src; } else { s.textContent = oldScript.textContent; }
                document.body.appendChild(s);
            });
        });

    fetch("../main/footer.html")
        .then(res => res.text())
        .then(data => { document.getElementById("footer").innerHTML = data; });
</script>

<body>
    <div id="header"></div>
    <div class="wrap">
        <h1>아이디 찾기</h1>
        <p class="desc">이메일 인증으로 아이디 찾기가 가능합니다.</p>

        <div class="card">
            <!-- 회원유형 -->
            <div class="row">
                <label for="memberType">회원유형</label>
                <select id="memberType" class="select" aria-label="회원유형">
                    <option value="personal">일반회원</option>
                    <option value="business">판매자회원</option>
                </select>
            </div>

            <!-- 이름 입력 -->
            <div class="row">
                <label for="name">이름</label>
                <input id="name" class="field" type="text" placeholder="이름을 입력하세요" autocomplete="name" required>
            </div>

            <div class="bar" aria-hidden="true"></div>

            <!-- 이메일 인증 영역 -->
            <section id="emailSection" aria-label="이메일 인증">
                <div class="row">
                    <label for="email">이메일로 찾기</label>
                    <input id="email" class="field" type="email" placeholder="example@domain.com" autocomplete="email">
                    <p class="helper">이름과 이메일이 모두 입력되어야 인증번호를 전송합니다.</p>
                </div>
                <div class="sub-actions">
                    <!-- 초기 비활성화 -->
                    <button id="sendEmailCode" class="btn" type="button" disabled>인증번호 전송</button>
                </div>
                <div id="emailVerifyGroup" class="row-email hidden">
                    <label class="sr-only" for="emailCode">인증번호</label>
                    <div class="inline">
                        <input id="emailCode" class="field" type="text" inputmode="numeric" pattern="[0-9]*"
                            placeholder="전송받은 인증번호 입력">
                        <button id="verifyEmailCode" class="btn" type="button">확인</button>
                    </div>
                </div>
            </section>

            <div class="actions">
                <button id="cancelBtn" class="btn secondary" type="button" onclick="location.href='#'">취소</button>
                <button id="nextBtn" class="btn" type="button" disabled>다음</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 상태 관리 (이메일만) =====
        const state = { emailCode: null, emailVerified: false };
        const $ = (sel) => document.querySelector(sel);

        const nextBtn = $('#nextBtn');

        function validateBasic() {
            const nameOk = $('#name').value.trim().length >= 2;
            const email = $('#email').value.trim();
            const emailOk = /.+@.+\..+/.test(email);
            return nameOk && emailOk && state.emailVerified;
        }

        function updateNextAvailability() {
            nextBtn.disabled = !validateBasic();
        }

        // 이름 입력 여부에 따라 "인증번호 전송" 버튼 활성/비활성
        function updateSendButtons() {
            const nameOk = $('#name').value.trim().length >= 2;
            const emailBtn = document.getElementById('sendEmailCode');
            if (emailBtn) emailBtn.disabled = !nameOk;
        }

        // 입력 변경 시 버튼 상태/다음 버튼 갱신
        ['#name', '#email', '#emailCode'].forEach(sel => {
            const el = $(sel); if (!el) return;
            el.addEventListener('input', () => { updateNextAvailability(); updateSendButtons(); });
        });

        // ===== 인증번호 전송 (Mock) =====
        function pseudoSend(to) {
            // 실제 구현 시: 서버에서 "이름 + 이메일" DB일치 여부 확인 후 발송.
            return new Promise(resolve => setTimeout(resolve, 600));
        }

        document.getElementById('sendEmailCode').addEventListener('click', async () => {
            const name = $('#name').value.trim();
            if (name.length < 2) { alert('이름을 입력해 주세요.'); $('#name').focus(); return; }
            const email = $('#email').value.trim();
            if (!/.+@.+\..+/.test(email)) { alert('이메일 형식을 확인해 주세요.'); return; }
            await pseudoSend(email);
            state.emailCode = String(Math.floor(100000 + Math.random() * 900000));
            console.log('[DEV] email code:', state.emailCode);
            document.getElementById('emailVerifyGroup').classList.remove('hidden');
            alert('인증 번호를 전송했습니다!');
        });

        // ===== 인증번호 확인 (Mock) =====
        document.getElementById('verifyEmailCode').addEventListener('click', () => {
            const input = document.getElementById('emailCode').value.trim();
            if (input && input === state.emailCode) {
                state.emailVerified = true;
                alert('확인되었습니다!');
                updateNextAvailability();
            } else {
                alert('인증번호가 일치하지 않습니다.');
            }
        });

        // ===== 다음 버튼 =====
        nextBtn.addEventListener('click', () => {
            if (!validateBasic()) { alert('이름, 이메일 입력 및 인증을 완료해 주세요.'); return; }
            // 실제 구현 시: DB조회 후 결과 페이지로 이동
            // fetch('/api/account/find-id', { ... });
            location.href = '/account/find-id/result'; // TODO: 실제 주소로 변경
        });

        // 초기 상태
        updateSendButtons();
        updateNextAvailability();
    </script>

    <div id="footer"></div>
</body>

</html>
