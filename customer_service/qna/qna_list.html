<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/qna.css">
</head>
<body>
<!--헤더푸터 연결-->
    <script>
        fetch("../../main/header.html")
          .then(res => res.text())
          .then(data => {
            document.getElementById("header").innerHTML = data;

            // header.html 안의 스크립트 실행 강제
            const scripts = document.getElementById("header").querySelectorAll("script");
            scripts.forEach(oldScript => {
            const newScript = document.createElement("script");
            if (oldScript.src) {
                newScript.src = oldScript.src;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            document.body.appendChild(newScript);
            });
          });

       
        fetch("../../main/footer.html")
          .then(res => res.text())
          .then(data => {
            document.getElementById("footer").innerHTML = data;
          });
    </script>
    <div id="header"></div>

    <div id="content" class="cs_qna_list_wrap">
        <h1>문의하기</h1>
        <div class="cs_sub_nav">
            <ul>
                <li class="on"><a href="#">회원</a></li>
                <li><a href="#">쿠폰/이벤트</a></li>
                <li><a href="#">주문/결제</a></li>
                <li><a href="#">배송</a></li>
                <li><a href="#">취소/반품/교환</a></li>
                <li><a href="#">여행/숙박/항공</a></li>
                <li><a href="#">안전거래</a></li>
            </ul>
        </div>
        <div class="qna_list_area">
            <div class="qna_section">
                <h2>회원</h2>
                <table>
                    <colgroup>
                        <col style="width: 10%;">
                        <col style="width: auto;">
                        <col style="width: 15%;">
                        <col style="width: 15%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>유형</th>
                            <th>제목</th>
                            <th>상태</th>
                            <th>작성일</th>
                        </tr>
                    </thead>
                    <script>
                    const qnaData = {
                        "회원": [
                        { type: "[가입]", title: "가입 문의내용", status: "검토 중", date: "22.10.31" },
                        { type: "[탈퇴]", title: "탈퇴 문의내용", status: "검토 중", date: "22.10.31" },
                        { type: "[회원정보]", title: "회원정보 문의내용", status: "답변완료", date: "22.10.31" },
                        ],
                        "쿠폰/이벤트": [
                        { type: "[쿠폰]", title: "쿠폰 사용 문의", status: "검토 중", date: "22.11.01" },
                        { type: "[이벤트]", title: "이벤트 응모 문의", status: "답변완료", date: "22.11.02" },
                        ],
                        "주문/결제": [
                        { type: "[결제]", title: "결제 오류 발생", status: "검토 중", date: "22.11.03" },
                        { type: "[주문]", title: "주문 내역 문의", status: "답변완료", date: "22.11.04" },
                        ],
                        "배송": [
                        { type: "[배송]", title: "배송 지연 문의", status: "검토 중", date: "22.11.05" },
                        ],
                        "취소/반품/교환": [
                        { type: "[반품]", title: "반품 신청 방법", status: "검토 중", date: "22.11.06" },
                        ],
                        "여행/숙박/항공": [
                        { type: "[숙박]", title: "숙박 예약 취소", status: "답변완료", date: "22.11.07" },
                        ],
                        "안전거래": [
                        { type: "[보안]", title: "보안 관련 문의", status: "검토 중", date: "22.11.08" },
                        ]
                    };

                    function renderQnA(category) {
                        const qnaList = qnaData[category] || [];
                        const tableBody = document.querySelector(".qna_section tbody");
                        const sectionTitle = document.querySelector(".qna_section h2");

                        // 테이블 내용 초기화
                        tableBody.innerHTML = "";
                        sectionTitle.textContent = category;

                        // 항목 채우기
                        qnaList.forEach(qna => {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${qna.type}</td>
                            <td><a href="qna_view.html">${qna.title}</a></td>
                            <td class="${qna.status === '답변완료' ? 'status_complete' : 'status_pending'}">${qna.status}</td>
                            <td>${qna.date}</td>
                        `;
                        tableBody.appendChild(tr);
                        });
                    }

                    // 메뉴 클릭 이벤트 등록
                    document.addEventListener("DOMContentLoaded", () => {
                        const menuItems = document.querySelectorAll(".cs_sub_nav li");

                        menuItems.forEach(item => {
                        item.addEventListener("click", e => {
                            e.preventDefault();

                            // 선택된 카테고리 이름
                            const category = item.textContent.trim();

                            // 메뉴 on 클래스 처리
                            menuItems.forEach(i => i.classList.remove("on"));
                            item.classList.add("on");

                            // Q&A 목록 렌더링
                            renderQnA(category);
                        });
                        });

                        // 초기 로딩 시 "회원" 항목 표시
                        renderQnA("회원");
                    });
                    </script>

                    <tbody>
                        <!-- JavaScript가 동적으로 채움 -->
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <a href="#" class="prev">이전</a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#" class="next">다음</a>
            </div>
            <div class="btn_area">
                <a href="qna_write.html" class="btn_write">문의하기</a>
            </div>
        </div>
    </div>
<div id="footer"></div>    
</body>
</html>
